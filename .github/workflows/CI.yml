name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        - name: Install dependencies
        run: |
        python -m pip install --upgrade pip\
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    - name: Lint with flake8 (optional, потом добавим)
      run: |
        pip install flake8
        # Останавливаемся, если есть синтаксические ошибки или неопределенные имена
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test with pytest (создадим тесты позже)
      run: |
        pip install pytest
        pytest tests/ -v
    - name: Build Docker image
      run: |
        docker build -t bhp-api .
