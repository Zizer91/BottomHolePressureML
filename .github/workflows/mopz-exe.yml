name: AcidClean PRO exe

on:
  workflow_dispatch:
  push:
    paths:
      - "mopz/**"
      - ".github/workflows/mopz-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mopz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean AcidCleanPRO.spec
          copy examples\demo.acp dist\AcidCleanPRO\
        shell: cmd
      - name: Smoke test (batch report)
        run: start /wait "" dist\AcidCleanPRO\AcidCleanPRO.exe examples\demo.acp --pdf smoke.pdf && if not exist smoke.pdf exit 1
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: AcidCleanPRO-windows
          path: mopz/dist/AcidCleanPRO
